<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111319">
<title>LA 593 · Ecuador en el Alma</title>
<style>
  :root { --gold:#f2a51a; --gold2:#ffca54; --bg:#090a0d; --panel:#15171d; --muted:#a6a9b4; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px; color:#f5f5f7; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(ellipse at 50% 0%, #242630 0%, #101116 45%, #06070a 100%); }
  .player { width:min(100%,340px); border-radius:24px; padding:18px 16px 20px; background:linear-gradient(155deg,#1c1e25,#111217 65%,#17181d); border:1px solid #343741; box-shadow:0 25px 70px #0009, inset 0 1px 0 #ffffff12; }
  .live-row { display:flex; align-items:center; justify-content:space-between; margin:0 4px 12px; color:#d8d9de; font-weight:700; letter-spacing:.08em; font-size:14px; }
  .live { color:#ff9b9e; border:1px solid #7d303b; border-radius:99px; padding:4px 9px; background:#3b1820; display:flex; gap:8px; align-items:center; }
  .dot { width:9px;height:9px;border-radius:50%;background:#ff4058;box-shadow:0 0 12px #ff4058; }
  .art { aspect-ratio:1; border:2px solid var(--gold); border-radius:18px; padding:0; margin-bottom:16px; background:#000; overflow:hidden; position:relative; display:block; }
  .art-logo { display:block; width:100%; height:100%; object-fit:contain; border-radius:16px; }
  .art:before,.art:after { display:none; }
  .crest { z-index:1; font-size:clamp(38px,13vw,62px); margin-bottom:2px; filter:drop-shadow(0 4px 4px #000); }
  .art h1 { z-index:1; margin:0; line-height:.92; font-family:Georgia,serif; font-size:clamp(34px,10vw,52px); text-shadow:2px 4px 0 #000,0 0 14px #f5b62a66; letter-spacing:-1px; }
  .art h1 span { display:block; color:#fff2ce; font-size:.68em; }
  .art h1 em { color:#ffbe35; font-style:normal; }
  .art .tagline { z-index:1; margin:14px 0 0; font:italic bold clamp(12px,3.7vw,16px) Georgia,serif; color:#ffe6a4; }
  .art .symbols { z-index:1; font-size:25px; margin-top:14px; letter-spacing:5px; }
  .quality { text-align:center; color:#d1aa59; letter-spacing:.08em; font-size:10px; font-weight:700; margin-bottom:12px; }
  .quality span { border:1px solid #b99140; border-radius:6px; padding:3px 7px; margin-left:6px; }
  .station { text-align:center; margin-bottom:16px; }
  .station h2 { font-size:30px; margin:0; letter-spacing:.02em; }
  .station h3 { color:var(--gold); font-size:16px; margin:4px 0; letter-spacing:.06em; }
  .station p { color:#c5c7ce; font-size:14px; margin:4px 0; }
  .station small { color:#a4a6b0; font-style:italic; font-size:12px; }
  .visualizer { height:42px; border-radius:12px; border:1px solid #282a32; background:#090a0c; display:flex; align-items:center; justify-content:center; gap:5px; margin:14px 0 12px; padding:0 10px; overflow:hidden; }
  .bar { width:7px; height:8px; border-radius:3px; background:linear-gradient(#ffd15b,var(--gold)); opacity:.85; transition:height .15s; }
  .playing .bar { animation: bounce .8s ease-in-out infinite alternate; }
  .bar:nth-child(3n) { animation-delay:.1s }.bar:nth-child(4n) { animation-delay:.25s }.bar:nth-child(5n) { animation-delay:.4s }.bar:nth-child(7n) { animation-delay:.18s }
  @keyframes bounce { from { height:5px } to { height:28px } }
  .volume-row { display:flex; align-items:center; gap:9px; color:#aaaeb8; margin:10px 4px 16px; }
  .volume-row svg { flex:0 0 16px; width:16px; }
  input[type=range] { width:100%; accent-color:var(--gold); cursor:pointer; }
  .controls { display:flex; align-items:center; justify-content:center; gap:8px; }
  button { border:1px solid #30333e; color:#e9eaf0; background:linear-gradient(#222530,#171922); width:48px;height:48px; border-radius:50%; cursor:pointer; display:grid;place-items:center; box-shadow:0 6px 15px #0005; transition:transform .12s,filter .12s; }
  button:active { transform:scale(.94) }
  button:hover { filter:brightness(1.18) }
  button svg { width:19px;height:19px;fill:currentColor; }
  .play { width:78px;height:78px; background:linear-gradient(145deg,#ffbd37,#e88a08); border:3px solid #ffda7c; color:#17130b; box-shadow:0 0 0 6px #f4ad2720,0 10px 26px #e38b1c35; }
  .play svg { width:27px;height:27px; }
  .fav { color:#ffc43d; border-color:#8a6a1e; background:linear-gradient(#292516,#1b1a15); }
  .fav.active { background:#443518; box-shadow:0 0 15px #eaa62555; }
  .status { text-align:center; color:#9ea1ad; font-size:11px; min-height:16px; margin-top:12px; }
  .footer { text-align:center; color:#656975; font-size:9px; margin-top:12px; letter-spacing:.08em; }
  @media(max-width:380px){ .player{padding:18px 16px}.controls{gap:8px}button{width:54px;height:54px}.play{width:94px;height:94px} }

  /* Compact visual tuning based on the preview */
  .player { width:min(100%,300px); padding:14px 13px 16px; border-radius:22px; }
  .live-row { font-size:12px; margin-bottom:9px; }
  .live { padding:3px 8px; gap:6px; font-size:11px; }
  .dot { width:7px; height:7px; }
  .art { margin-bottom:11px; border-radius:15px; }
  .quality { font-size:9px; margin-bottom:9px; }
  .station { margin-bottom:12px; }
  .station h2 { font-size:25px; }
  .station h3 { font-size:13px; }
  .station p { font-size:12px; }
  .station small { font-size:10px; }
  .visualizer { height:34px; gap:4px; margin:10px 0 9px; padding:0 8px; }
  .bar { width:5px; }
  @keyframes bounce { from { height:4px } to { height:22px } }
  .volume-row { gap:7px; margin:8px 3px 12px; }
  .volume-row svg { flex-basis:14px; width:14px; }
  button { width:40px; height:40px; }
  button svg { width:16px; height:16px; }
  .play { width:64px; height:64px; }
  .play svg { width:22px; height:22px; }
  .status { font-size:10px; margin-top:10px; }
  .footer { margin-top:9px; font-size:8px; }
  @media(max-width:380px){ .player { padding:14px 13px 16px; } .controls { gap:7px; } button { width:40px; height:40px; } .play { width:64px; height:64px; } }

</style>

<script>
  const STREAM = 'https://sonicpanel.streamsolutions.us:10911/stream';
  const audio = document.getElementById('audio');
  const player = document.getElementById('player');
  const status = document.getElementById('status');
  const playBtn = document.getElementById('play');
  const playIcon = document.getElementById('playIcon');
  const vol = document.getElementById('volume');
  audio.src = STREAM; audio.volume = Number(vol.value);
  const playSvg = '<path d="M8 5v14l11-7L8 5z"/>';
  const pauseSvg = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  function setPlaying(on){
    player.classList.toggle('playing',on);
    playIcon.innerHTML = on ? pauseSvg : playSvg;
    playBtn.title = on ? 'Pausar' : 'Reproducir';
    status.textContent = on ? 'Conectado · En vivo' : 'Listo para escuchar · Presiona ▶';
  }
  async function start(){ try { status.textContent='Conectando a la radio…'; audio.src=STREAM; await audio.play(); setPlaying(true); } catch(e) { status.textContent='No se pudo conectar. Intenta nuevamente.'; setPlaying(false); } }
  playBtn.addEventListener('click',()=> audio.paused ? start() : (audio.pause(),setPlaying(false)));
  document.getElementById('stop').addEventListener('click',()=>{audio.pause();audio.currentTime=0;setPlaying(false);status.textContent='Radio detenida';});
  document.getElementById('reload').addEventListener('click',()=>{audio.pause();audio.src=STREAM;start();});
  vol.addEventListener('input',()=>{audio.volume=Number(vol.value);audio.muted=false;document.getElementById('mute').classList.remove('active');});
  document.getElementById('mute').addEventListener('click',()=>{audio.muted=!audio.muted;document.getElementById('mute').classList.toggle('active',audio.muted);status.textContent=audio.muted?'Audio silenciado':'Volumen activado';});
  document.getElementById('favorite').addEventListener('click',e=>{e.currentTarget.classList.toggle('active');status.textContent=e.currentTarget.classList.contains('active')?'Radio añadida a favoritos ♥':'Favorito desactivado';});
  audio.addEventListener('playing',()=>setPlaying(true)); audio.addEventListener('pause',()=>setPlaying(false)); audio.addEventListener('error',()=>status.textContent='Error de conexión con el stream.');
  const bars=document.getElementById('visualizer'); for(let i=0;i<34;i++){const b=document.createElement('i');b.className='bar';bars.appendChild(b)}
  function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())} clock(); setInterval(clock,30000);
</script>
